services:
  - type: web
    name: crop-protection-system
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn CropProtectionSystem.app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: DATABASE_URL
        fromDatabase:
          name: crop-protection-db
          property: connectionString

databases:
  - name: crop-protection-db
    databaseName: crop_protection
    user: postgres
    plan: free
