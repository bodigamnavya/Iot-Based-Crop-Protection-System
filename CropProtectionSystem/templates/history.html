<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Animal detection history — view all past detections recorded by the AI crop protection system.">
    <title>Detection History — AI Crop Protection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <!-- Header -->
    <header class="header">
        <h1>📋 Animal Detection History</h1>
        <p>Past detections recorded by YOLO AI</p>
    </header>

    <!-- Loading State -->
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <span>Loading history…</span>
    </div>

    <!-- Empty State (hidden by default) -->
    <div class="empty-state" id="empty-state" style="display: none;">
        <div class="icon">🔍</div>
        <p>No animal detections recorded yet.</p>
    </div>

    <!-- History Table -->
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Animal</th>
                    <th>Confidence</th>
                    <th>Time</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="history-body">
            </tbody>
        </table>
    </div>

    <!-- Navigation -->
    <div class="nav-buttons">
        <a href="{{ url_for('index') }}" class="btn btn-primary">← Back to Dashboard</a>
        <a href="{{ url_for('water_history') }}" class="btn">🚰 Water History</a>
    </div>

    <!-- Footer -->
    <div class="footer">
        IoT Based Crop Protection System &copy; 2026
    </div>

</div>

<script src="{{ url_for('static', filename='config.js') }}"></script>
<script src="{{ url_for('static', filename='script.js') }}"></script>
<script>
    loadHistory();
</script>

</body>
</html>
