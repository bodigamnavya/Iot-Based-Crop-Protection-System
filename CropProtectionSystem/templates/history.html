<!DOCTYPE html>
<html>
<head>
    <title>Detection History</title>
</head>

<body>

<h1>Animal Detection History</h1>

{% if data %}

<table border="1">

<tr>
    <th>Animal</th>
    <th>Confidence</th>
    <th>Time</th>
    <th>Status</th>
</tr>

{% for row in data %}

<tr>
    <td>{{ row[0] }}</td>
    <td>{{ row[1] }}</td>
    <td>{{ row[2] }}</td>
    <td>{{ row[3] }}</td>
</tr>

{% endfor %}

</table>

{% else %}

<p>No animal detections yet.</p>

{% endif %}

<br>

<a href="/">Back to Dashboard</a>

</body>
</html>
