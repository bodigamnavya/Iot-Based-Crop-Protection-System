<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Water management history — soil moisture and pump status records from the IoT crop protection system.">
    <title>Water History — AI Crop Protection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <!-- Header -->
    <header class="header">
        <h1>🚰 Water Management History</h1>
        <p>Soil moisture and pump activity log</p>
    </header>

    <!-- Loading State -->
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <span>Loading water history…</span>
    </div>

    <!-- Empty State (hidden by default) -->
    <div class="empty-state" id="empty-state" style="display: none;">
        <div class="icon">💧</div>
        <p>No water management records yet.</p>
    </div>

    <!-- Water History Table -->
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Soil Moisture</th>
                    <th>Pump Status</th>
                    <th>Time</th>
                </tr>
            </thead>
            <tbody id="water-body">
            </tbody>
        </table>
    </div>

    <!-- Navigation -->
    <div class="nav-buttons">
        <a href="{{ url_for('index') }}" class="btn btn-primary">← Back to Dashboard</a>
        <a href="{{ url_for('history') }}" class="btn">📋 Animal Detection History</a>
    </div>

    <!-- Footer -->
    <div class="footer">
        IoT Based Crop Protection System &copy; 2026
    </div>

</div>

<script src="{{ url_for('static', filename='config.js') }}"></script>
<script src="{{ url_for('static', filename='script.js') }}"></script>
<script>
    loadWaterHistory();
</script>

</body>
</html>
